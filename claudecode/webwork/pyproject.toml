[project]
name = "llm-comparison-mcp"
version = "0.1.0"
description = "MCP Server for comparing LLM responses from multiple platforms"
requires-python = ">=3.11"
dependencies = [
    "mcp[server]>=1.1.0",
    "playwright>=1.48.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
